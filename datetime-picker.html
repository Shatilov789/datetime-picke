<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Дата и время</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
    :root {
        color-scheme: light dark;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: var(--tg-theme-bg-color, #ffffff);
        color: var(--tg-theme-text-color, #000000);
        margin: 0;
        padding: 16px;
        display: flex;
        flex-direction: column;
        align-items: center;
        min-height: 100vh;
    }
    h3 {
        margin: 4px 0 16px;
        font-weight: 600;
    }
    .picker {
        position: relative;
        display: flex;
        width: 100%;
        max-width: 420px;
        height: 180px;
        background: var(--tg-theme-secondary-bg-color, #f1f1f3);
        border-radius: 16px;
        overflow: hidden;
    }
    .picker::before,
    .picker::after {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        height: 72px;
        pointer-events: none;
        z-index: 2;
    }
    .picker::before {
        top: 0;
        background: linear-gradient(to bottom, var(--tg-theme-secondary-bg-color, #f1f1f3), transparent);
    }
    .picker::after {
        bottom: 0;
        background: linear-gradient(to top, var(--tg-theme-secondary-bg-color, #f1f1f3), transparent);
    }
    .highlight-band {
        position: absolute;
        left: 0;
        right: 0;
        top: 72px;
        height: 36px;
        border-top: 1px solid var(--tg-theme-hint-color, #999999);
        border-bottom: 1px solid var(--tg-theme-hint-color, #999999);
        pointer-events: none;
        z-index: 1;
        opacity: 0.35;
    }
    .wheel-col {
        flex: 1;
        height: 180px;
        overflow-y: scroll;
        scroll-snap-type: y mandatory;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
    }
    .wheel-col::-webkit-scrollbar { display: none; }
    .wheel-pad { height: 72px; }
    .wheel-item {
        height: 36px;
        line-height: 36px;
        text-align: center;
        scroll-snap-align: center;
        font-size: 18px;
        opacity: 0.35;
        transition: opacity 0.15s, font-weight 0.15s;
        user-select: none;
    }
    .wheel-item.selected {
        opacity: 1;
        font-weight: 700;
    }
    .labels {
        display: flex;
        width: 100%;
        max-width: 420px;
        margin-top: 6px;
        font-size: 11px;
        color: var(--tg-theme-hint-color, #999999);
        text-align: center;
    }
    .labels span { flex: 1; }
    .btn-confirm {
        margin-top: 28px;
        width: 100%;
        max-width: 420px;
        padding: 15px;
        border: none;
        border-radius: 12px;
        background-color: var(--tg-theme-button-color, #2481cc);
        color: var(--tg-theme-button-text-color, #ffffff);
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
    }
</style>
</head>
<body>
    <h3>Выбери дату и время</h3>
    <div class="picker" id="picker">
        <div class="highlight-band"></div>
        <div class="wheel-col" id="col-day"></div>
        <div class="wheel-col" id="col-month"></div>
        <div class="wheel-col" id="col-year"></div>
        <div class="wheel-col" id="col-hour"></div>
        <div class="wheel-col" id="col-minute"></div>
    </div>
    <div class="labels">
        <span>День</span><span>Месяц</span><span>Год</span><span>Час</span><span>Мин</span>
    </div>
    <button class="btn-confirm" id="save-btn">Подтвердить</button>

<script>
    var tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    var ITEM_HEIGHT = 36;

    function pad2(n) { return String(n).padStart(2, "0"); }

    function range(start, end) {
        var out = [];
        for (var i = start; i <= end; i++) out.push(i);
        return out;
    }

    var now = new Date();
    var columns = {
        day:    { values: range(1, 31).map(pad2),              default: now.getDate() - 1 },
        month:  { values: range(1, 12).map(pad2),               default: now.getMonth() },
        year:   { values: range(now.getFullYear() - 1, now.getFullYear() + 1).map(String), default: 1 },
        hour:   { values: range(0, 23).map(pad2),                default: now.getHours() },
        minute: { values: range(0, 59).map(pad2),                default: now.getMinutes() }
    };

    var state = {};

    function buildColumn(key) {
        var col = document.getElementById("col-" + key);
        var cfg = columns[key];
        var topPad = document.createElement("div");
        topPad.className = "wheel-pad";
        col.appendChild(topPad);

        cfg.values.forEach(function (value, idx) {
            var item = document.createElement("div");
            item.className = "wheel-item";
            item.textContent = value;
            item.dataset.index = idx;
            col.appendChild(item);
        });

        var bottomPad = document.createElement("div");
        bottomPad.className = "wheel-pad";
        col.appendChild(bottomPad);

        col.scrollTop = cfg.default * ITEM_HEIGHT;
        state[key] = cfg.default;
        updateSelected(col, cfg.default);

        var scrollTimer = null;
        col.addEventListener("scroll", function () {
            clearTimeout(scrollTimer);
            scrollTimer = setTimeout(function () {
                var idx = Math.round(col.scrollTop / ITEM_HEIGHT);
                idx = Math.max(0, Math.min(cfg.values.length - 1, idx));
                col.scrollTo({ top: idx * ITEM_HEIGHT, behavior: "smooth" });
                state[key] = idx;
                updateSelected(col, idx);
            }, 120);
        });
    }

    function updateSelected(col, idx) {
        col.querySelectorAll(".wheel-item").forEach(function (el) {
            el.classList.toggle("selected", Number(el.dataset.index) === idx);
        });
    }

    ["day", "month", "year", "hour", "minute"].forEach(buildColumn);

    function getField() {
        var params = new URLSearchParams(window.location.search);
        return params.get("field") || "";
    }

    document.getElementById("save-btn").addEventListener("click", function () {
        var day = columns.day.values[state.day];
        var month = columns.month.values[state.month];
        var year = columns.year.values[state.year];
        var hour = columns.hour.values[state.hour];
        var minute = columns.minute.values[state.minute];

        var payload = {
            field: getField(),
            date: day + "." + month + "." + year,
            time: hour + ":" + minute
        };

        tg.sendData(JSON.stringify(payload));
        tg.close();
    });
</script>
</body>
</html>
